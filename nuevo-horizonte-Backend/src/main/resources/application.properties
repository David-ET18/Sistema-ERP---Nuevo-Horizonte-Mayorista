spring.application.name=nuevo-horizonte-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/nuevo_horizonte
spring.datasource.username=postgres
spring.datasource.password=jose21
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Crea automaticamente los schemas de Postgres (catalogo, seguridad, ventas)
# si no existen. Sin esto, ddl-auto=update crea las tablas pero falla si el
# schema destino aun no existe (hay que crearlo a mano una sola vez).
spring.jpa.properties.hibernate.hbm2ddl.auto.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Bogota

app.jwt.secret=clave-super-secreta-nuevo-horizonte-2026-cambiar-en-produccion
app.jwt.expiration-ms=86400000

app.frontend-url=http://localhost:5173
app.password-reset.expiration-minutes=30

# Carga de archivos (logos de agencia, archivos de respaldo de tarifas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB