spring.application.name=nuevo-horizonte-backend

server.port=${SERVER_PORT:8080}

# BASE DE DATOS
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nuevo_horizonte}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto.create_namespaces=true
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Bogota

# FLYWAY
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# SEGURIDAD
app.jwt.secret=${JWT_SECRET:dev-solo-local-reemplazar-antes-de-produccion-minimo-32-bytes-12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-secure=${COOKIE_SECURE:true}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=30
app.seguridad.seed-demo-usuarios=${SEED_DEMO_USUARIOS:true}

# VARIABLES RESEND
app.email.enabled=${EMAIL_ENABLED:false}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${MAIL_FROM:onboarding@resend.dev}

# ARCHIVOS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
