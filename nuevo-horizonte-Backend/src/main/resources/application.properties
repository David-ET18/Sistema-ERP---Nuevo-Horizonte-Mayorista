spring.application.name=nuevo-horizonte-backend

server.port=${SERVER_PORT:8080}

# Todo parametrizado por variables de entorno. Los defaults son valores
# neutros e inofensivos (NO son secretos): sirven para arrancar sin configurar
# nada, pero jamas contienen credenciales reales.
# Desarrollo local con tus credenciales: crea el archivo NO versionado
# nuevo-horizonte-Backend/config/application.properties (ver .gitignore) con
# tus valores reales; Spring lo carga automaticamente y pisa estos defaults.
# Docker/produccion: todo llega por el .env via docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nuevo_horizonte}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# NOTA PROFESIONAL: update crea/ajusta tablas al arrancar. Aceptado para este
# tamano de proyecto; lo que ya NO se hace a ciegas son los cambios manuales:
# esos van versionados en db/migration/ via Flyway (V1, V2, ...). El paso a
# validate + baseline DDL completo queda como evolucion documentada, no como
# deuda silenciosa.
spring.jpa.properties.hibernate.hbm2ddl.auto.create_namespaces=true
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Bogota

# Migraciones versionadas (db/migration/V*.sql). baseline-on-migrate=true para
# que BDs creadas antes de Flyway (sin tabla flyway_schema_history) se marquen
# como V1 aplicada en el primer arranque en vez de fallar. Jamas editar un
# migration ya aplicado: el cambio va en uno nuevo.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# Placeholder SOLO para desarrollo sin configurar nada. docker-compose.yml
# EXIGE JWT_SECRET real en el .env (falla al arrancar si falta), asi que este
# valor jamas llega a produccion. Genera el tuyo con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:dev-solo-local-reemplazar-antes-de-produccion-minimo-32-bytes-12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# false solo para probar por HTTP plano (docker-compose local sin TLS); en
# produccion real (HTTPS) dejar siempre en true.
app.jwt.cookie-secure=${COOKIE_SECURE:true}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=30

# true en desarrollo (crea ADM/GRT/AP/AV con admin123). En produccion poner
# false DESPUES de crear el admin real; en false no se crea ni se borra nada.
app.seguridad.seed-demo-usuarios=${SEED_DEMO_USUARIOS:true}

# Envio de correos (recuperacion de contrasena) via la API de Resend (resend.com).
# app.email.enabled=false (por defecto) usa EmailConsolaService: el correo solo
# queda en el log, no se envia de verdad. Para activarlo: crea una cuenta en
# resend.com, genera una API key, y define EMAIL_ENABLED=true y RESEND_API_KEY
# en el .env (nunca hardcodeadas aqui). El remitente por defecto
# (onboarding@resend.dev) es el dominio de pruebas de Resend y funciona sin
# verificar nada; para produccion hay que verificar un dominio propio.
app.email.enabled=${EMAIL_ENABLED:false}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${MAIL_FROM:onboarding@resend.dev}

# Carga de archivos (logos de agencia, archivos de respaldo de tarifas)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
