services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nuevo_horizonte}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Solo accesible desde el propio host (localhost), nunca desde la red
    # publica: util para conectar un cliente SQL en local, pero en un
    # servidor con IP publica "0.0.0.0:5432:5432" expondria la base de
    # datos a internet si no hay firewall.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./nuevo-horizonte-Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-nuevo_horizonte}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en tu .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SEED_DEMO_USUARIOS: ${SEED_DEMO_USUARIOS:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    build: ./nuevo-horizonte-Frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Vacio -> HTTP normal en :80 (lo de siempre, igual que hoy). Con un
      # dominio real y su certificado ya emitido (ver init-letsencrypt.sh),
      # el propio contenedor pasa solo a HTTPS en cada arranque.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"

  # Inactivo hasta que corras init-letsencrypt.sh (ver DEPLOY.md). Mientras
  # tanto solo reintenta renovar cada 12h certificados que todavia no
  # existen, sin fallar ni afectar al resto de servicios.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  db_data:
  backend_uploads:
  certbot_conf:
  certbot_www:
