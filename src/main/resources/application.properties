spring.application.name=usuarios

spring.datasource.url=jdbc:postgresql://localhost:5432/ERP_BD
spring.datasource.username=postgres
spring.datasource.password=jose21
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=mySuperSecretKeyForJWTTokenGenerationThatIsAtLeast32CharactersLong1234567890
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

logging.level.com.example.usuarios=DEBUG
logging.level.org.springframework.security=DEBUG