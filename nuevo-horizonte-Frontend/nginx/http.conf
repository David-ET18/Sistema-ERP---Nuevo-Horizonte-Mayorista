server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx corta en 1MB por defecto; el backend acepta hasta 10MB (logos de
    # agencia, respaldos de tarifas). Sin esto, esas subidas fallarian con
    # 413 antes de llegar al backend.
    client_max_body_size 12m;

    # Certbot valida el dominio pidiendo este archivo por HTTP antes de emitir
    # el certificado. Sigue aqui aunque no haya dominio todavia: no estorba.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
