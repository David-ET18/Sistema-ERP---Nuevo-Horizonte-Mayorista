server {
    listen 80;
    server_name nhcore-mayorista.duckdns.org;

    # Validacion de Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nhcore-mayorista.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/nhcore-mayorista.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhcore-mayorista.duckdns.org/privkey.pem;

    client_max_body_size 12M;

    # API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

server {
    listen 80;
    server_name nhcore-n8n.duckdns.org;

    # Validacion de Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nhcore-n8n.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/nhcore-n8n.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhcore-n8n.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://n8n:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
